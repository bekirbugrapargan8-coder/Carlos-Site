<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Carloss Site - Giriş Yap</title>
    <style>
        body { background-color: #36393f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #2f3136; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; width: 300px; }
        h1 { color: #7289da; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; background: #202225; color: white; }
        button { width: 100%; padding: 10px; background-color: #7289da; border: none; color: white; border-radius: 4px; cursor: pointer; }
        .profile-demo { margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; background-color: #40444b; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    </style>
</head>
<body>

<div class="card">
    <div class="profile-demo">
        <div class="avatar">🎮</div> <!-- Discord tarzı profil ikonu -->
    </div>
    <h1>Carloss Site</h1>
    <input type="text" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button onclick="kayitOl()">Kayıt Ol</button>
</div>

<script>
    function kayitOl() {
        alert("Firebase bağlantısı bekleniyor! Şu an sadece test aşamasındayız.");
        // Firebase kodları buraya eklenecek
    }
</script>

</body>
</html>
