<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet-X - Hoş Geldin!</title>
    <!-- Google Fonts - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Arka Plan: Discord benzeri koyu mor/gri tonları */
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
        }

        /* Arka plana hareketli efekt katmanı (Daha az sade dursun diye) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
            opacity: 0.5;
            z-index: -1;
        }

        .auth-container {
            background-color: #23272a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h1 {
            color: #7289da; /* Discord mavisi */
            font-weight: 600;
            margin-bottom: 10px;
        }

        .auth-container p {
            color: #b9bbbe;
            margin-bottom: 30px;
        }

        .form-control {
            background-color: #2f3136;
            border: 1px solid #202225;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .form-control:focus {
            background-color: #2f3136;
            border-color: #7289da;
            box-shadow: none;
            color: #ffffff;
        }

        .btn-primary {
            background-color: #7289da;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #5b6eae;
        }

        .switch-auth {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #b9bbbe;
        }

        .switch-auth a {
            color: #7289da;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-circle {
            width: 80px; height: 80px;
            background-color: #7289da;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            margin: -80px auto 20px; /* Kutunun dışına taşsın */
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 2rem;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-circle">⚡</div>
    <h1>Sohbet-X</h1>
    <p>Kurucu Baran seni bekliyor. Hemen giriş yap!</p>

    <!-- Giriş Formu -->
    <div id="loginForm">
        <input type="email" class="form-control" placeholder="E-Posta Adresin">
        <input type="password" class="form-control" placeholder="Şifren">
        <button class="btn btn-primary">Giriş Yap</button>
        <div class="switch-auth">
            Hesabın yok mu? <a onclick="toggleForms()">Kayıt Ol</a>
        </div>
    </div>

    <!-- Kayıt Formu (Başlangıçta gizli) -->
    <div id="registerForm" style="display: none;">
        <input type="text" class="form-control" placeholder="Kullanıcı Adın (Baran vs.)">
        <input type="email" class="form-control" placeholder="E-Posta Adresin">
        <input type="password" class="form-control" placeholder="Şifren">
        <button class="btn btn-primary">Kayıt Ol</button>
        <div class="switch-auth">
            Zaten hesabın var mı? <a onclick="toggleForms()">Giriş Yap</a>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Giriş ve Kayıt formları arasında geçiş yapan basit JavaScript
    function toggleForms() {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        
        if (loginForm.style.display === 'none') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        }
    }
</script>

</body>
</html>
