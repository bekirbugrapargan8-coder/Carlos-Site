<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carloss Slot</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #2f3136; padding: 20px; border-radius: 15px; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; align-items: center; justify-content: space-between; background: #202225; padding: 10px; border-radius: 10px; margin-bottom: 20px; }
        .coin-display { color: #f1c40f; font-weight: bold; }
        /* Slot Makinesi Ekranı */
        .slot-screen { font-size: 50px; background: #000; padding: 20px; border-radius: 10px; margin: 20px 0; border: 4px solid #7289da; }
        /* Kırmızı Kol */
        .red-lever { width: 40px; height: 120px; background: #e74c3c; border-radius: 5px; margin: 0 auto; cursor: pointer; transition: 0.2s; border: 2px solid #c0392b; }
        .red-lever:active { background: #c0392b; transform: translateY(10px); }
        .info { font-size: 12px; color: #999; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>👑 Carloss</div>
        <div class="coin-display" id="coin-val">100 Coin</div>
    </div>

    <div class="slot-screen" id="slot">🎰</div>
    
    <p>Döndürmek için kırmızı kola bas!</p>
    <div class="red-lever" onclick="cevir()"></div>
    <div class="info">Her çevirme: 10 Coin</div>
</div>

<script>
    let coins = localStorage.getItem("carloss_coins") ? parseInt(localStorage.getItem("carloss_coins")) : 100;
    const semboller = ["🍒", "🍋", "💎", "⭐", "🔔"];
    
    document.getElementById("coin-val").innerText = coins + " Coin";

    function cevir() {
        if (coins < 10) { alert("Yeterli coin yok!"); return; }
        
        coins -= 10;
        document.getElementById("slot").innerText = "⏳"; // Dönüyor gibi yap

        setTimeout(() => {
            let s1 = semboller[Math.floor(Math.random() * semboller.length)];
            let s2 = semboller[Math.floor(Math.random() * semboller.length)];
            let s3 = semboller[Math.floor(Math.random() * semboller.length)];
            
            document.getElementById("slot").innerText = `${s1}${s2}${s3}`;

            if (s1 === s2 && s2 === s3) {
                let odul = (s1 === "💎") ? 500 : 100; // Elmas gelirse büyük ikramiye
                coins += odul;
                alert("BÜYÜK KAZANÇ! +" + odul);
            }

            localStorage.setItem("carloss_coins", coins);
            document.getElementById("coin-val").innerText = coins + " Coin";
        }, 500);
    }
</script>

</body>
</html>
